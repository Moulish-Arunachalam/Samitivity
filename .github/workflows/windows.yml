name: Build and test Samitivity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samitivity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: ./scripts/test-portable.sh
  windows:
    name: Windows Server 2025 build and installer smoke tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build, test native decoders and publish
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Publish
      - name: Test packaging orchestration and private-bundle guards
        shell: pwsh
        run: ./scripts/test-packaging.ps1
      - name: Install verified pinned packaging tool
        shell: pwsh
        run: ./scripts/install-inno.ps1
      - name: Build per-user installer (no private recordings)
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Test installed startup and data preservation (Server 2025)
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Samitivity-win-x64-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Samitivity-test-results
          path: tests/**/TestResults/*.trx
          retention-days: 14
