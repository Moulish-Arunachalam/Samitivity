name: Build and test Samitivity
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing version tag to release or backfill, such as v0.1.1
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: samitivity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' && format('refs/tags/{0}', inputs.version_tag) || github.ref }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: ./scripts/test-portable.sh
  windows:
    name: Windows Server 2025 build and installer smoke tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' && format('refs/tags/{0}', inputs.version_tag) || github.ref }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify release tag matches application version
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '')
        shell: pwsh
        env:
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: |
          if ($env:VERSION_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Release tags must use vMAJOR.MINOR.PATCH.' }
          [xml]$project = Get-Content src/Samitivity.Windows/Samitivity.Windows.csproj
          $versions = @($project.Project.PropertyGroup.Version | Where-Object { $_ })
          $expectedVersion = ($Matches[1..3] -join '.')
          if ($versions.Count -ne 1 -or $versions[0].Trim() -ne $expectedVersion) { throw 'Release tag version must match Samitivity.Windows.csproj.' }
      - name: Build, test native decoders and publish
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Publish
      - name: Test packaging orchestration and private-bundle guards
        shell: pwsh
        run: ./scripts/test-packaging.ps1
      - name: Install verified pinned packaging tool
        shell: pwsh
        run: ./scripts/install-inno.ps1
      - name: Build per-user installer (no private bundle)
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Test installed startup and data preservation (Server 2025)
        if: hashFiles('scripts/test-installer.ps1') != ''
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Samitivity-win-x64-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Samitivity-test-results
          path: |
            tests/**/TestResults/*.trx
            tests/**/TestResults/*.png
          retention-days: 14
  release:
    name: Publish versioned GitHub release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '')
    needs: [portable, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version_tag != '' && format('refs/tags/{0}', inputs.version_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Samitivity-win-x64-installer
          path: release-assets
      - name: Prepare stable latest download and checksums
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          version="${VERSION_TAG#v}"
          expected="Samitivity-${version}-win-x64-setup.exe"
          test -f "release-assets/$expected"
          cp "release-assets/$expected" release-assets/Samitivity-latest-win-x64-setup.exe
          (cd release-assets && sha256sum "$expected" Samitivity-latest-win-x64-setup.exe > SHA256SUMS.txt)
      - name: Create release with permanent installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            latest_flag=(--latest=false)
          else
            latest_flag=(--latest)
          fi
          gh release create "$VERSION_TAG" \
            "release-assets/Samitivity-${VERSION_TAG#v}-win-x64-setup.exe" \
            release-assets/Samitivity-latest-win-x64-setup.exe \
            release-assets/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "Samitivity ${VERSION_TAG#v}" \
            "${latest_flag[@]}"
